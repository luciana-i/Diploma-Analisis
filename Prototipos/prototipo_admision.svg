<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="100%" height="100%" style="background:#f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <!-- Sombra de la ventana -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ventana WinForms Principal -->
  <g filter="url(#drop-shadow)" transform="translate(30, 20)">
    <!-- Marco y Fondo de la Ventana -->
    <rect x="0" y="0" width="660" height="570" rx="6" ry="6" fill="#F0F0F0" stroke="#1B3A57" stroke-width="2"/>

    <!-- Barra de Título (Windows TitleBar) -->
    <path d="M 0,6 Q 0,0 6,0 L 654,0 Q 660,0 660,6 L 660,34 L 0,34 Z" fill="#1B3A57"/>
    <!-- Icono de Cruz Roja / Salud -->
    <rect x="12" y="9" width="16" height="16" rx="2" fill="#E74C3C"/>
    <path d="M 17,17 L 23,17 M 20,14 L 20,20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="36" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Sagrado Corazón - Admisión y Guardia (CU01 / CU02)</text>
    
    <!-- Botones Ventana (Min, Max, Close) -->
    <rect x="560" y="0" width="32" height="34" fill="transparent"/>
    <text x="572" y="20" fill="#BDC3C7" font-size="12">─</text>
    <rect x="593" y="0" width="32" height="34" fill="transparent"/>
    <rect x="604" y="12" width="10" height="10" stroke="#BDC3C7" stroke-width="1.5" fill="none"/>
    <path d="M 626,0 L 660,0 Q 660,0 660,6 L 660,34 L 626,34 Z" fill="#C0392B"/>
    <text x="639" y="21" fill="#FFFFFF" font-size="14" font-weight="bold">✕</text>

    <!-- CUADRO 1: Identificación del Paciente (CU01) -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="620" height="70" rx="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <!-- Header GroupBox -->
      <rect x="12" y="-9" width="165" height="16" fill="#FFFFFF"/>
      <text x="16" y="3" fill="#1B3A57" font-size="11" font-weight="bold"> IDENTIFICACIÓN PACIENTE </text>
      
      <!-- Controles -->
      <text x="25" y="40" fill="#2C3E50" font-size="12" font-weight="600">DNI / Documento:</text>
      <rect x="145" y="23" width="190" height="28" rx="2" fill="#FFFFFF" stroke="#7F8C8D" stroke-width="1"/>
      <text x="155" y="42" fill="#2C3E50" font-size="13" font-weight="bold">38.452.190</text>
      
      <!-- Botón Buscar -->
      <rect x="350" y="22" width="150" height="30" rx="3" fill="#2980B9" stroke="#1F618D" stroke-width="1"/>
      <text x="375" y="42" fill="#FFFFFF" font-size="12" font-weight="bold">🔍 Buscar Paciente</text>
      
      <rect x="510" y="26" width="90" height="22" rx="11" fill="#E8F8F5" stroke="#27AE60" stroke-width="1"/>
      <text x="522" y="41" fill="#27AE60" font-size="10" font-weight="bold">✓ REGISTRADO</text>
    </g>

    <!-- CUADRO 2: Datos Filiatorios (CU02) -->
    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="620" height="145" rx="3" fill="#FAFAFA" stroke="#BDC3C7" stroke-width="1"/>
      <rect x="12" y="-9" width="190" height="16" fill="#FAFAFA"/>
      <text x="16" y="3" fill="#1B3A57" font-size="11" font-weight="bold"> DATOS FILIATORIOS (PADRÓN) </text>

      <!-- Fila 1 -->
      <text x="25" y="38" fill="#566573" font-size="11" font-weight="600">Nombre:</text>
      <rect x="85" y="22" width="205" height="26" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <text x="95" y="39" fill="#2C3E50" font-size="12">Juan Manuel</text>

      <text x="315" y="38" fill="#566573" font-size="11" font-weight="600">Apellido:</text>
      <rect x="380" y="22" width="215" height="26" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <text x="390" y="39" fill="#2C3E50" font-size="12">Gómez Fernández</text>

      <!-- Fila 2 -->
      <text x="25" y="78" fill="#566573" font-size="11" font-weight="600">Fec. Nac:</text>
      <rect x="85" y="62" width="140" height="26" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <text x="95" y="79" fill="#2C3E50" font-size="12">14/05/1992 📅</text>

      <text x="315" y="78" fill="#566573" font-size="11" font-weight="600">Teléfono:</text>
      <rect x="380" y="62" width="215" height="26" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <text x="390" y="79" fill="#2C3E50" font-size="12">11-5489-2311</text>

      <!-- Botón Alta rápida / Modificar -->
      <rect x="380" y="102" width="215" height="28" rx="3" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
      <text x="415" y="120" fill="#7F8C8D" font-size="11" font-weight="bold">➕ Modificar / Alta Paciente</text>
    </g>

    <!-- CUADRO 3: Registro de Episodio Asistencial -->
    <g transform="translate(20, 295)">
      <rect x="0" y="0" width="620" height="190" rx="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <rect x="12" y="-9" width="230" height="16" fill="#FFFFFF"/>
      <text x="16" y="3" fill="#1B3A57" font-size="11" font-weight="bold"> REGISTRO DE EPISODIO ASISTENCIAL </text>

      <!-- Meta Info -->
      <text x="25" y="32" fill="#7F8C8D" font-size="11">Fecha/Hora Ingreso:</text>
      <text x="140" y="32" fill="#1B3A57" font-size="12" font-weight="bold">29/08/2026 - 19:53 hs</text>

      <text x="340" y="32" fill="#7F8C8D" font-size="11">Operador / Recepción:</text>
      <text x="475" y="32" fill="#1B3A57" font-size="12" font-weight="bold">Recep_Noche_02</text>

      <!-- Motivo de Consulta -->
      <text x="25" y="65" fill="#2C3E50" font-size="12" font-weight="bold">Motivo de Consulta (Triaje inicial):</text>
      <rect x="25" y="75" width="570" height="95" rx="3" fill="#FCFDFD" stroke="#95A5A6" stroke-width="1.2"/>
      
      <text x="38" y="98" fill="#2C3E50" font-size="12">Paciente ingresa por guardia refiriendo dolor abdominal agudo en fosa ilíaca derecha,</text>
      <text x="38" y="118" fill="#2C3E50" font-size="12">acompañado de cuadro febril moderado de 4 horas de evolución y náuseas.</text>
      <text x="38" y="138" fill="#7F8C8D" font-size="11" font-style="italic">Refiere no haber tomado medicación previa.</text>

      <!-- Scrollbar decorativa -->
      <rect x="583" y="77" width="10" height="91" rx="2" fill="#EBEDEF"/>
      <rect x="584" y="80" width="8" height="35" rx="2" fill="#BDC3C7"/>
    </g>

    <!-- BARRA INFERIOR / BOTONES DE ACCIÓN -->
    <g transform="translate(20, 505)">
      <!-- Botón Cancelar -->
      <rect x="180" y="5" width="160" height="38" rx="4" fill="#FFFFFF" stroke="#95A5A6" stroke-width="1.2"/>
      <text x="220" y="29" fill="#7F8C8D" font-size="12" font-weight="bold">✖ Cancelar / Limpiar</text>

      <!-- Botón Confirmar Ingreso -->
      <rect x="360" y="5" width="235" height="38" rx="4" fill="#27AE60" stroke="#1E8449" stroke-width="1.5"/>
      <text x="388" y="29" fill="#FFFFFF" font-size="12" font-weight="bold">✔ Confirmar Ingreso a Guardia</text>
    </g>
  </g>
</svg>
